name: Deploy to Railway

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Least-privilege GITHUB_TOKEN. Deploys via RAILWAY_TOKEN (separate secret);
# nothing in this workflow needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Don't fail-fast: each service deploys independently; one flaky CLI exit
    # shouldn't cancel the others. The job below also tolerates the railway CLI
    # exiting non-zero when Railway's actual deploy is healthy (--ci mode quirk).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: cmms-api
            src: apps/api
            config: railway.json
          - service: cmms-worker
            src: apps/api
            config: railway.worker.json
          - service: cmms-web
            src: apps/web
            config: railway.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Let railway CLI's exit code fail the job. The previous `|| echo ...`
      # masked real deploy failures (e.g. Railpack falling back when
      # RAILWAY_CONFIG_FILE wasn't picked up, or build errors that turned
      # the Railway dashboard red while CI stayed green). If we hit CLI
      # false-positives again, prefer a follow-up status check over silently
      # swallowing the exit code.
      # The Railway CLI (v4) does NOT honor RAILWAY_CONFIG_FILE for `up` — it
      # always reads ./railway.json from the upload root. So for any service
      # whose config isn't named railway.json (the worker uses
      # railway.worker.json: Dockerfile.worker, `node dist/worker-main`, 1
      # replica), stage that file as railway.json in this throwaway runner
      # checkout before deploying. Without this the worker built the API image
      # and crashed running dist/main.js ("Missing required environment
      # variables: CORS_ORIGINS").
      - name: Deploy ${{ matrix.service }}
        working-directory: ${{ matrix.src }}
        run: |
          if [ "${{ matrix.config }}" != "railway.json" ]; then
            cp "${{ matrix.config }}" railway.json
          fi
          railway up --service ${{ matrix.service }} --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
