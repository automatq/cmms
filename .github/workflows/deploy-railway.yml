name: Deploy to Railway

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Don't fail-fast: each service deploys independently; one flaky CLI exit
    # shouldn't cancel the others. The job below also tolerates the railway CLI
    # exiting non-zero when Railway's actual deploy is healthy (--ci mode quirk).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: cmms-api
            src: apps/api
            config: railway.json
          - service: cmms-worker
            src: apps/api
            config: railway.worker.json
          - service: cmms-web
            src: apps/web
            config: railway.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # railway up --ci sometimes exits 1 even when the deploy completed and
      # the healthcheck passed. Treat the CLI exit as advisory and rely on
      # Railway's own status as the source of truth. If the CLI exits non-zero
      # we just log it; a failed deploy will be visible in the Railway
      # dashboard and surfaced by other monitoring.
      - name: Deploy ${{ matrix.service }}
        working-directory: ${{ matrix.src }}
        run: railway up --service ${{ matrix.service }} --ci || echo "::warning::railway CLI exited non-zero for ${{ matrix.service }}; check Railway dashboard for actual deploy status"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CONFIG_FILE: ${{ matrix.config }}
