name: Deploy to Railway

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Don't fail-fast: each service deploys independently; one flaky CLI exit
    # shouldn't cancel the others. The job below also tolerates the railway CLI
    # exiting non-zero when Railway's actual deploy is healthy (--ci mode quirk).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: cmms-api
            src: apps/api
            config: railway.json
          - service: cmms-worker
            src: apps/api
            config: railway.worker.json
          - service: cmms-web
            src: apps/web
            config: railway.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Let railway CLI's exit code fail the job. The previous `|| echo ...`
      # masked real deploy failures (e.g. Railpack falling back when
      # RAILWAY_CONFIG_FILE wasn't picked up, or build errors that turned
      # the Railway dashboard red while CI stayed green). If we hit CLI
      # false-positives again, prefer a follow-up status check over silently
      # swallowing the exit code.
      - name: Deploy ${{ matrix.service }}
        working-directory: ${{ matrix.src }}
        run: railway up --service ${{ matrix.service }} --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CONFIG_FILE: ${{ matrix.config }}
