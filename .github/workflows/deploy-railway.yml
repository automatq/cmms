name: Deploy to Railway

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - service: cmms-api
            src: apps/api
            config: railway.json
          - service: cmms-worker
            src: apps/api
            config: railway.worker.json
          - service: cmms-web
            src: apps/web
            config: railway.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        working-directory: ${{ matrix.src }}
        run: railway up --service ${{ matrix.service }} --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CONFIG_FILE: ${{ matrix.config }}
