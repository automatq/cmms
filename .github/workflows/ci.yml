name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN. CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: ${{ matrix.app }} - typecheck
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
          - app: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Typecheck API
        if: matrix.app == 'api'
        run: npx --workspace=@maintek/api tsc --noEmit

      - name: Typecheck Web
        if: matrix.app == 'web'
        run: npm run typecheck --workspace=@maintek/web

  lint:
    name: ${{ matrix.app }} - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
          - app: web
          - app: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            apps/mobile/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Lint gates merges on errors only — existing warnings are tracked but
      # don't block. Remove the warning escape hatch (drop the comment + add
      # --max-warnings=0) once the warning count drops to zero.
      - name: Lint API
        if: matrix.app == 'api'
        working-directory: apps/api
        run: npx eslint "src/**/*.ts"

      - name: Lint Web
        if: matrix.app == 'web'
        working-directory: apps/web
        run: npx eslint "src/**/*.{ts,tsx}"

      - name: Lint Mobile
        if: matrix.app == 'mobile'
        working-directory: apps/mobile
        run: npx eslint "app/**/*.{ts,tsx}" "src/**/*.{ts,tsx}"

  audit:
    # Hard-gates HIGH + CRITICAL CVEs in production deps of the deployed
    # services (web + api). The Next 15 / NestJS 11 / multer 2 / Sentry 10
    # upgrades cleared all HIGH+CRITICAL, so the gate is now `high` (was
    # `critical`). Mobile's expo SDK 50 transitives still carry high CVEs
    # that need an expo major upgrade — out of scope here, hence the
    # workspace scoping to api + web only.
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high --workspace=apps/api --workspace=apps/web

  e2e-marketing:
    # Smoke-test the public marketing pages against production after every push.
    # Cheap (~3s, no signups), runs in parallel with typecheck. Use to catch
    # rebrand regressions, broken links, or 500s on the unauthenticated surface.
    name: e2e marketing
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx --workspace=@maintek/web playwright install --with-deps chromium

      - name: Run marketing smoke tests
        working-directory: apps/web
        run: npx playwright test marketing --reporter=list
